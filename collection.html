<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection | Top Drawer Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== NAVIGATION ========== -->
<nav id="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">
      <img src="images/Top Drawer.png" alt="Top Drawer Cards Logo" class="nav-logo-img">
      <span class="logo-text">TOP DRAWER <span class="logo-accent">CARDS</span></span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="collection.html">Collection</a></li>
      <li><a href="soccer-sets.html">Sets</a></li>
      <li><a href="index.html#instagram">Follow</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
  </div>
</nav>

<!-- ========== COLLECTION PAGE ========== -->
<section id="collection-page" style="padding-top: 120px;">
  <div class="collection-container">
    <div class="section-head" style="margin-bottom: 80px;">
      <h2 class="sec-title" style="margin-bottom: 8px;">THE COLLECTION</h2>
      <p class="sec-sub">A curated showcase of premium sports cards</p>
    </div>

    <!-- Category Filter Buttons -->
    <div class="category-filter-wrapper">
      <div class="category-filter">
        <button class="filter-btn active" data-category="all">All</button>
      </div>
    </div>

    <p id="sheetStatus" style="display:none; margin-top:10px; color:#d9534f; font-size:0.95rem; max-width:420px;"></p>

    <!-- Cards Grid -->
    <div class="card-grid" id="cardsGrid">
      <!-- Cards will be loaded here by JavaScript -->
    </div>

    <!-- Back to Home -->
    <div class="collection-footer">
      <a href="index.html" class="btn btn-outline">← Back to Home</a>
    </div>
  </div>
</section>

<!-- ========== FOOTER ========== -->
<footer style="background: rgba(0,0,0,.3); padding: 40px 24px; text-align: center; border-top: 1px solid var(--border);">
  <p style="color: var(--muted); font-size: 0.9rem;">© 2026 Top Drawer Cards. All rights reserved.</p>
</footer>

<script src="collection-data.js"></script>
<script src="script.js"></script>
<script>
  // Shared collection data reference
  const collectionData = window.COLLECTION_DATA || []; // will be updated by the collection page sheet loader

  function parseCSV(text) {
    const rows = text.trim().split(/\r?\n/).filter(line => line.trim().length);
    if (!rows.length) return [];

    const headers = rows.shift().split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(h => h.trim().replace(/^\"|\"$/g, ''));
    return rows.map(row => {
      const values = row.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(v => v.trim().replace(/^\"|\"$/g, ''));
      const record = {};
      headers.forEach((header, index) => {
        record[header] = values[index] || '';
      });
      return record;
    });
  }

  function normalizeCategoryValue(value) {
    if (!value) return 'other-sports';
    return value.toString().trim().toLowerCase().replace(/[-_]+/g, ' ').replace(/\s+/g, ' ');
  }

  function normalizeCSVRow(row) {
    const normalized = {};
    Object.entries(row).forEach(([key, value]) => {
      const normalizedKey = key.trim().toLowerCase().replace(/[\s_-]+/g, '');
      normalized[normalizedKey] = value.trim();
    });

    return {
      id: normalized.id ? Number(normalized.id) : Date.now(),
      category: normalizeCategoryValue(normalized.category) || 'other-sports',
      number: normalized.number || '',
      playerName: normalized.playername || normalized.player || normalized.subject || normalized.name || normalized.title || '',
      team: normalized.team || normalized.set || '',
      year: normalized.year || '',
      variant: normalized.variant || 'variant-holo',
      badge: normalized.badge || '',
      badgeClass: normalized.badgeclass || '',
      condition: normalized.condition || '',
      grade: normalized.grade || '',
      printRun: normalized.printrun || '',
      image: normalized.image || normalized.img || normalized.imageurl || ''
    };
  }

  function showCSVMessage(message, isError = false) {
    const messageEl = document.getElementById('sheetStatus');
    if (!messageEl) return;
    if (!message) {
      messageEl.style.display = 'none';
      messageEl.textContent = '';
      return;
    }
    messageEl.textContent = message;
    messageEl.style.color = isError ? '#d9534f' : 'var(--muted)';
    messageEl.style.display = 'block';
  }

  function getGoogleSheetCsvUrl(sheetUrl) {
    const idMatch = sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if (!idMatch) return null;

    let gid = '0';
    const gidMatch = sheetUrl.match(/[?&]gid=(\d+)|#gid=(\d+)/);
    if (gidMatch) {
      gid = gidMatch[1] || gidMatch[2] || gid;
    }

    return `https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv&gid=${gid}`;
  }

  async function loadGoogleSheet(sheetUrl) {
    const csvUrl = getGoogleSheetCsvUrl(sheetUrl);
    if (!csvUrl) {
      showCSVMessage('Could not determine sheet CSV URL.', true);
      return;
    }

    showCSVMessage('');
    try {
      const response = await fetch(csvUrl);
      if (!response.ok) {
        throw new Error(`Status ${response.status}`);
      }

      const text = await response.text();
      const parsed = parseCSV(text);
      if (!parsed.length) {
        showCSVMessage('Google Sheet is empty or not formatted correctly.', true);
        return;
      }

      const importedCards = parsed.map(normalizeCSVRow);
      collectionData.splice(0, collectionData.length, ...importedCards);
      const activeCategory = document.querySelector('.filter-btn.active')?.dataset.category || 'all';
      renderCategoryButtons(activeCategory);
      renderCards(activeCategory);
    } catch (error) {
      showCSVMessage('Could not load the Google Sheet. Check sharing settings and URL.', true);
      console.error(error);
    }
  }

  // Google Sheet loading is handled by script.js using the shared COLLECTION_SHEET_URL.

  function createCategoryLabel(category) {
    if (!category || category === 'all') return 'All';
    return category
      .replace(/[-_]+/g, ' ')
      .replace(/\b\w/g, char => char.toUpperCase());
  }

  function renderCategoryButtons(activeCategory = 'all') {
    const filterContainer = document.querySelector('.category-filter');
    if (!filterContainer) return;

    const categories = Array.from(new Set(collectionData.map(card => normalizeCategoryValue(card.category || 'Uncategorized'))));
    filterContainer.innerHTML = '<button class="filter-btn ' + (activeCategory === 'all' ? 'active' : '') + '" data-category="all">All</button>' +
      categories.map(category => {
        return `<button class="filter-btn ${activeCategory === category ? 'active' : ''}" data-category="${category}">${createCategoryLabel(category)}</button>`;
      }).join('');

    filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards(btn.dataset.category);
      });
    });
  }

  // Render cards function
  function renderCards(category = 'all') {
    const cardsGrid = document.getElementById('cardsGrid');
    cardsGrid.innerHTML = '';

    const normalizedCategory = normalizeCategoryValue(category);
    const filteredCards = normalizedCategory === 'all'
      ? collectionData
      : collectionData.filter(card => normalizeCategoryValue(card.category) === normalizedCategory);

    // Deduplicate cards by `id` when present, otherwise fallback to player/team/year composite key.
    const seen = new Set();
    const uniqueCards = [];
    filteredCards.forEach(card => {
      const key = card.id || `${(card.playerName||'').trim().toLowerCase()}|${(card.team||'').trim().toLowerCase()}|${(card.year||'').trim()}`;
      if (!seen.has(key)) {
        seen.add(key);
        uniqueCards.push(card);
      }
    });

    uniqueCards.forEach(card => {
      const cardHTML = `
        <div class="card-item">
          <div class="card-front ${card.variant}">
            <div class="fc-stripe"></div>
            <div class="fc-body">
              <div class="player-placeholder">
                ${card.image ? `<img src="${card.image}" alt="${card.playerName}" class="player-image">` : `<span class="player-title">${card.playerName}</span>`}
              </div>
              <div class="fc-num">${card.number}</div>
            </div>
            <div class="fc-foot">
              <div class="fc-name">${card.playerName}</div>
              <div class="fc-team">${card.team} &middot; ${card.year}</div>
              <div class="fc-serial">${card.badge}</div>
            </div>
            <div class="fc-shine"></div>
            <span class="ci-name">${card.playerName}</span>
          </div>
        </div>
      `;
      cardsGrid.innerHTML += cardHTML;
    });

    // Re-apply fade animations to new cards
    const newCards = cardsGrid.querySelectorAll('.card-item');
    newCards.forEach(card => {
      card.classList.add('fade-up');
      card.classList.add('visible');
    });
  }
</script>

</body>
</html>
